<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Code Lyrics Player 🎵</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>

<body>
  <div class="page">
    <h1 class="title">Code-Lyrics Player 🎵</h1>

    <div class="controls">
      <input id="yt-input" type="text" placeholder="Paste YouTube link or video ID" />
      <button id="btn-generate">Generate</button>
      <button id="btn-play" disabled>Play</button>
      <button id="btn-pause" disabled>Pause</button>
      <button id="btn-restart" disabled>Restart</button>
      <button id="btn-download" disabled>Download</button>
      <button id="btn-edit" disabled>Edit</button>

      <span id="status" class="status"></span>
    </div>

        <!-- 🔄 Progress bar -->
    <div id="progress-container" class="progress-container" style="display:none;">
      <div id="progress-text" class="progress-text">Preparing...</div>
      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </div>

    <div class="lyrics-source">
      <label><input type="radio" name="lyrics-mode" value="manual" checked /> 가사 입력/검색</label>

      <!-- 🔍 Song title search --> 
      <div id="google-search-box">
        <input id="songTitle" type="text" placeholder="Enter song title (e.g. Just the Two of Us)" />
        <button id="searchButton" title="Search with Google®">
          <img src="{{ url_for('static', filename='search.png') }}" alt="Search">
        </button>
      </div>

      <!-- ✍️ Manual lyrics input (always visible) -->
      <textarea id="manual-lyrics" placeholder="여기에 가사를 붙여넣으세요" rows="5"></textarea>
    </div>




    <audio id="audio-player" controls style="width:100%;"></audio>

    <div class="terminal">
      <div class="terminal-header">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span class="term-title">lyrics@terminal:~</span>
      </div>

      <div id="terminal-body" class="terminal-body">
        <pre id="code" class="code"></pre>
        <div id="cursor" class="cursor">█</div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='main.js') }}" defer></script>
</body>
</html>
